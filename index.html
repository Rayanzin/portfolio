<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10131b">
    <meta name="description" content="Este site mudou. Acesse o novo site do Galego dos Sites.">
    <title>Este site mudou | Galego dos Sites</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #10131b;
            color: #f5f7fb;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at 50% 0%, rgb(93 73 220 / 20%), transparent 55%),
                #10131b;
        }

        main {
            width: min(100%, 620px);
            padding: clamp(32px, 8vw, 64px);
            border: 1px solid rgb(255 255 255 / 10%);
            border-radius: 28px;
            background: rgb(24 28 39 / 88%);
            text-align: center;
            box-shadow: 0 24px 80px rgb(0 0 0 / 30%);
        }

        .mark {
            display: grid;
            width: 58px;
            height: 58px;
            margin: 0 auto 28px;
            place-items: center;
            border: 1px solid rgb(167 151 255 / 30%);
            border-radius: 18px;
            background: rgb(119 94 255 / 14%);
            color: #b7a9ff;
            font-size: 27px;
            font-weight: 700;
        }

        .eyebrow {
            margin: 0 0 14px;
            color: #b7a9ff;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 8vw, 3.5rem);
            letter-spacing: -0.055em;
            line-height: 1.05;
        }

        .message {
            max-width: 430px;
            margin: 20px auto 30px;
            color: #aeb5c5;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .button {
            display: inline-flex;
            min-height: 54px;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 24px;
            border-radius: 14px;
            background: #8b78ff;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            transition: background 160ms ease, transform 160ms ease;
        }

        .button:hover { background: #9b8bff; transform: translateY(-2px); }
        .button:focus-visible { outline: 3px solid #d2caff; outline-offset: 4px; }

        .address {
            display: block;
            margin-top: 18px;
            color: #8d96aa;
            font-size: 0.9rem;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .address:hover { color: #d2caff; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">↗</div>
        <p class="eyebrow">Uma novidade pra você</p>
        <h1>Este site mudou</h1>
        <p class="message">Agora estamos em um novo endereço. Acesse o novo site e confira tudo por lá.</p>
        <a class="button" href="https://galegodossites.vercel.app/">
            Ir para o novo site <span aria-hidden="true">→</span>
        </a>
        <a class="address" href="https://galegodossites.vercel.app/">galegodossites.vercel.app</a>
    </main>
</body>
</html>
